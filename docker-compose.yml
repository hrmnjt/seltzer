# Local Postgres for development and tests: `docker compose up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seltzer
      POSTGRES_PASSWORD: seltzer
      POSTGRES_DB: seltzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
